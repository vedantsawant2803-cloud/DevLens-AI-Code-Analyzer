# Root-level Netlify configuration for DevLens

[build]
  # Install root and client dependencies, then build the client
  command = "npm install && cd client && npm install && npm run build"
  publish = "client/dist"

# Rewrite all frontend /api/* requests to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://devlens-ai-code-analyzer-1.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback to index.html for React Router (SPA routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
