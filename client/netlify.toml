# Netlify configuration file for DevLens Frontend

[build]
  command = "npm run build"
  publish = "dist"

# Rewrite all frontend /api/* requests to the backend server (avoids CORS issues)
[[redirects]]
  from = "/api/*"
  to = "https://devlens-ai-code-analyzer-1.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback to index.html for React Router (SPA routing support)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
